spring.application.name=glowbook

spring.datasource.url=jdbc:mysql://localhost:3306/glowbook
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:glowbook-local-secret-change-me}
app.jwt.expiration-seconds=86400
app.jwt.refresh-expiration-days=30
app.scheduler.reminder-cron=0 0 10 * * *
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
