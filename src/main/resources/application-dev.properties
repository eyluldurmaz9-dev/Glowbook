spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/glowbook}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:glowbook-local-secret-change-me}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
app.scheduler.reminder-cron=${REMINDER_CRON:0 0 10 * * *}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
