server.port=${PORT:8080}
glowbook.business-time-zone=${GLOWBOOK_BUSINESS_TIME_ZONE:Europe/Istanbul}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST}:${MYSQLPORT:3306}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD}}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.initialization-fail-timeout=${DB_INITIALIZATION_FAIL_TIMEOUT_MS:60000}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1200000}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
app.scheduler.reminder-cron=${REMINDER_CRON:0 0 10 * * *}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app}
app.demo-users.enabled=${ENABLE_DEMO_USERS:false}
app.demo-users.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo-users.employee-password=${DEMO_EMPLOYEE_PASSWORD:}
app.demo-users.customer-password=${DEMO_CUSTOMER_PASSWORD:}
app.sms.provider=${SMS_PROVIDER:log}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

# WhatsApp Business Platform / Cloud API - see docs/WHATSAPP_NOTIFICATIONS.md.
# enabled=false (default) until a real salon is live on GlowBook.
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.provider=${WHATSAPP_PROVIDER:log}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:v21.0}
whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:appointment_confirmation_tr}
whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:tr}
whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
