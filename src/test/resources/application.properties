spring.datasource.url=jdbc:h2:mem:glowbook;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Deterministic value so WhatsAppWebhookControllerIntegrationTest can exercise the real
# verify-token check without needing a live Meta subscription.
whatsapp.webhook-verify-token=test-verify-token

# The feature is enabled by default across the suite so its actual behavior gets
# exercised (always against FakeWhatsAppSender, never the real API); the disabled
# (production default) path has its own dedicated test with a property override.
app.whatsapp.enabled=true
